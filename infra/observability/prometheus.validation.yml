# Synthetic validation credentials only; never reuse this file in production.
global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files:
  - /etc/prometheus/schedra.rules.yml
scrape_configs:
  - job_name: schedra
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: local_validation_metrics_not_for_production
    static_configs:
      - targets: ["backend:3333"]
  - job_name: schedra-events
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: local_events_metrics_token_not_for_production
    static_configs:
      - targets: ["events:3334"]
