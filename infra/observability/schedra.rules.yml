groups:
  - name: schedra
    rules:
      - record: schedra:business_availability:ratio5m
        expr: |
          1 - (
            sum(rate(schedra_http_requests_total{job="schedra",route=~"/api/.*",status=~"5.."}[5m])) or vector(0)
          ) / clamp_min(sum(rate(schedra_http_requests_total{job="schedra",route=~"/api/.*"}[5m])), 0.000001)
      - record: schedra:business_reads:p95_seconds5m
        expr: |
          histogram_quantile(0.95, sum by (le) (
            rate(schedra_http_request_duration_seconds_bucket{job="schedra",method="GET",route=~"/api/(clients|appointments|personal-events).*"}[5m])
          ))
      - alert: SchedraApiUnavailable
        expr: up{job="schedra"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "O coletor nao consegue consultar a API do Schedra."
      - alert: SchedraBusinessErrors
        expr: schedra:business_availability:ratio5m < 0.995
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Respostas de negocio abaixo da meta proposta de disponibilidade."
