server {
  listen 80;
  server_name _;
  client_max_body_size 6m;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  add_header X-Content-Type-Options nosniff always;
  location /api/ { proxy_pass http://backend:3333; }
  location /uploads/ { proxy_pass http://backend:3333; }
  location = /health { proxy_pass http://backend:3333; }
  location = /ready { proxy_pass http://backend:3333; }
  location = /metrics { proxy_pass http://backend:3333; }
  location / { proxy_pass http://frontend:80; }
}
